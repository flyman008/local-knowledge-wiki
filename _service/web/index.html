<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知识库 · 内容浏览</title><style>
:root{--bg:#f5f4f0;--fg:#26312b;--muted:#737b75;--line:#dfe3dc;--accent:#305f4c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.7 system-ui,"Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:7px;background:white;color:var(--fg);padding:8px 14px}button:hover{border-color:var(--accent)}a{color:var(--accent)}header{display:flex;justify-content:space-between;align-items:center;background:white;border-bottom:1px solid var(--line);padding:22px 4%}h1{font-size:25px;margin:0}small,.muted{color:var(--muted)}main{max-width:1450px;margin:auto;padding:26px 4%}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:25px}.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:15px 20px}.stat b{display:block;font-size:29px}form{display:flex;gap:9px;flex-wrap:wrap}input,select{padding:10px;border:1px solid var(--line);border-radius:7px;background:white;color:var(--fg)}input{flex:1;min-width:220px}.primary{background:var(--accent);color:white}#summary{font-size:13px;color:var(--muted);margin:12px 0}.layout{display:grid;grid-template-columns:minmax(290px,410px) minmax(0,1fr);gap:22px}.panel{background:white;border:1px solid var(--line);border-radius:11px;overflow:hidden}#list{max-height:73vh;overflow:auto}.item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:18px 20px}.item.active{background:#edf3ed;border-left:4px solid var(--accent)}h3{font-size:16px;line-height:1.6;margin:0 0 8px}.badge{display:inline-block;background:#f0f2ed;border-radius:4px;padding:1px 7px;font-size:12px;margin:2px 4px 2px 0}.warn{background:#fff0d5;color:#88611f}#detail{padding:26px;min-height:480px;max-height:80vh;overflow:auto}h2{font-size:23px;line-height:1.5;margin:0 0 12px}.notice{background:#f7f4e9;border-left:3px solid #b8a05d;padding:10px 13px;margin:17px 0;font-size:13px}.tabs{display:flex;gap:7px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:20px}.tabs [aria-selected=true]{background:var(--accent);color:white}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.9 system-ui,"Microsoft YaHei",sans-serif;margin:0}.block{padding:16px 0;border-bottom:1px solid var(--line)}.empty{padding:30px;color:var(--muted)}.snippet{font-size:13px;color:var(--muted);margin-top:8px}footer{font-size:12px;color:var(--muted);margin-top:22px}@media(max-width:850px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}#list{max-height:340px}#detail{max-height:none}}
.prose{line-height:1.9;overflow-wrap:anywhere}.prose h2{font-size:21px;margin:24px 0 12px}.prose h3{margin-top:22px}.prose p{margin:10px 0}.prose .bullet{padding-left:16px}.prose code,.code{background:#f4f5f1;padding:3px 6px;border-radius:4px}.tablewrap{overflow:auto}table{border-collapse:collapse;font-size:14px;width:100%}th,td{border:1px solid var(--line);padding:9px;text-align:left;min-width:90px}th{background:#f4f5f1}
</style></head><body><header><div><h1>知识库</h1><small>把材料、知识和依据放在一起</small></div><div><small id="connection" role="status">连接中…</small> <button id="refresh">刷新</button></div></header><main>
<section class="stats"><div class="stat">可阅读知识<b id="total">—</b></div><div class="stat">有待确认事项<b id="pending">—</b></div><div class="stat">解析不完整<b id="partial">—</b></div><div class="stat">原件待解析<b id="unfinished">—</b></div></section>
<form id="form"><input id="q" aria-label="搜索内容" placeholder="搜索标题或正文，例如：销售、OpenAI、会员"><button class="primary">搜索</button><select id="scope" aria-label="资料范围"><option value="">全部范围</option><option value="weimob">微盟</option><option value="external">外部</option></select><select id="tag" aria-label="内容标签"><option value="">全部标签</option></select><select id="state" aria-label="核验状态"><option value="">全部状态</option><option value="readable">可阅读知识</option><option value="needs_parse">原件待解析</option><option value="pending">有待确认</option><option value="partial">解析不完整</option><option value="unclassified">待分类</option></select></form>
<div id="summary" role="status"></div><div class="layout"><section class="panel" id="list" aria-label="知识列表"></section><article class="panel" id="detail"><div class="empty">选择一条知识，查看正文、来源与处理记录。</div></article></div><footer>本地只读浏览 · 搜索不调用大模型 · 保存成功不等于事实已确认。本版不提供删除、审批或付费问答。</footer></main>
<script>
const $=id=>document.getElementById(id),names={weimob:'微盟',external:'外部'};let all=[],selected='',seq=0,detailSeq=0;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=v=>v?new Date(v).toLocaleString('zh-CN'):'未知';
// Original dates deliberately do not use the ingestion-time formatter.
const dateControls=document.createElement('div');dateControls.style.cssText='display:flex;gap:9px;flex-wrap:wrap;margin-top:10px';
dateControls.innerHTML='<select id="age" aria-label="原材料日期"><option value="">全部材料日期</option><option value="known">日期已记录</option><option value="unknown">日期未知或未记录</option><option value="old">原材料超过一年（不等于失效）</option></select><label>原材料日期从 <input id="dateFrom" type="date" style="min-width:0" aria-label="原材料起始日期"></label><label>至 <input id="dateTo" type="date" style="min-width:0" aria-label="原材料结束日期"></label><select id="dateSort" aria-label="排序"><option value="updated">知识稿最近更新优先</option><option value="source">原材料日期新到旧</option></select>';
$('form').after(dateControls);
function dateMatches(x){const d=x.material_date||{},a=$('age').value,from=$('dateFrom').value,to=$('dateTo').value;return (!a||(a==='known'&&d.value)||(a==='unknown'&&!d.value)||(a==='old'&&d.older_than_year))&&(!from||(d.latest&&d.latest>=from))&&(!to||(d.earliest&&d.earliest<=to));}
function dateInfo(d){d=d||{};return '<div class="muted">'+esc(d.value?d.label+' '+d.value:'原材料日期未知'+(d.status==='unrecorded'?'（未记录）':''))+(d.older_than_year?' · 超过一年，使用前复核':'')+(d.future?' · 日期在未来，请核对':'')+'</div>';}
function markdown(text){
 const inline=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
 const lines=text.replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n/,'').split(/\r?\n/);let out=[],code=null;
 for(let i=0;i<lines.length;i++){let s=lines[i];if(/^```/.test(s)){if(code!==null){out.push('<pre class="code">'+esc(code.join('\n'))+'</pre>');code=null}else code=[];continue}if(code!==null){code.push(s);continue}
 if(s.includes('|')&&i+1<lines.length&&/^\s*\|?\s*:?-{3,}/.test(lines[i+1])){const cells=v=>v.trim().replace(/^\||\|$/g,'').split('|');let table='<div class="tablewrap"><table><thead><tr>'+cells(s).map(x=>'<th>'+inline(x)+'</th>').join('')+'</tr></thead><tbody>';i+=2;for(;i<lines.length&&lines[i].includes('|');i++)table+='<tr>'+cells(lines[i]).map(x=>'<td>'+inline(x)+'</td>').join('')+'</tr>';i--;out.push(table+'</tbody></table></div>');continue}
 const h=s.match(/^(#{1,6})\s+(.*)/);if(h){const level=Math.min(h[1].length+1,6);out.push('<h'+level+'>'+inline(h[2])+'</h'+level+'>')}else if(/^\s*[-*]\s+/.test(s))out.push('<p class="bullet">• '+inline(s.replace(/^\s*[-*]\s+/,''))+'</p>');else if(s.trim())out.push('<p>'+inline(s)+'</p>');
 }if(code!==null)out.push('<pre>'+esc(code.join('\n'))+'</pre>');return out.join('');
}
const url=v=>{try{const u=new URL(v);return ['https:','http:'].includes(u.protocol)?u.href:null}catch{return null}};
async function get(u){const r=await fetch(u);if(!r.ok)throw Error('服务返回 '+r.status);return r.json()}
function badges(x){return [...(x.classification?.scopes||[]).map(s=>names[s]||s),...(x.classification?.tags||[])].map(t=>`<span class="badge">${esc(t)}</span>`).join('')+(x.content_status==='needs_parse'?'<span class="badge warn">原件待解析</span>':'')+(x.pending_count?'<span class="badge warn">有待确认</span>':'')+(x.parse_complete===0?'<span class="badge warn">解析不完整</span>':'')+dateInfo(x.material_date)}
async function load(){try{const d=await get('/api/library/catalog');all=d.items;$('total').textContent=all.filter(x=>x.content_status==='readable').length;$('pending').textContent=all.filter(x=>x.pending_count).length;$('partial').textContent=all.filter(x=>x.parse_complete===0).length;$('unfinished').textContent=all.filter(x=>x.content_status==='needs_parse').length;const old=$('tag').value;$('tag').innerHTML='<option value="">全部标签</option>'+[...new Set(all.flatMap(x=>x.classification.tags))].sort().map(t=>`<option>${esc(t)}</option>`).join('');$('tag').value=old;$('connection').textContent='本地已连接 · '+new Date().toLocaleTimeString('zh-CN');await filter();if(selected)open(selected)}catch(e){$('connection').textContent='连接失败';$('summary').textContent='无法加载：'+e.message+'。请确认本地服务已启动。'}}
async function filter(){
 const n=++seq,q=$('q').value.trim();let rows=all;$('summary').textContent='查询中…';
 try{
  if($('dateFrom').value&&$('dateTo').value&&$('dateFrom').value>$('dateTo').value)throw Error('起始日期不能晚于结束日期');
  if(q){const hits=await get('/api/search?'+new URLSearchParams({q,kb_id:'library',limit:500}));if(n!==seq)return;const map=new Map(hits.map(x=>[x.doc_id,x.snip]));rows=all.filter(x=>map.has(x.id)||x.name.toLowerCase().includes(q.toLowerCase())).map(x=>({...x,snip:map.get(x.id)}));}
  const s=$('scope').value,t=$('tag').value,f=$('state').value;
  rows=rows.filter(x=>dateMatches(x)&&(!s||x.classification.scopes.includes(s))&&(!t||x.classification.tags.includes(t))&&(!f||(f==='readable'&&x.content_status==='readable')||(f==='needs_parse'&&x.content_status==='needs_parse')||(f==='pending'&&x.pending_count)||(f==='partial'&&x.parse_complete===0)||(f==='unclassified'&&!x.classification.scopes.length)));
  if($('dateSort').value==='source')rows=[...rows].sort((a,b)=>(b.material_date?.earliest||'').localeCompare(a.material_date?.earliest||''));
  $('summary').textContent=`显示 ${rows.length} / ${all.length} 条 · `+($('dateSort').value==='source'?'原材料日期优先，未知置后':'知识稿最近更新优先')+' · 日期范围按原文精度相交匹配'+(q?' · 正文最多召回500条':'');
  $('list').innerHTML=rows.length?rows.map(x=>`<button class="item ${x.id===selected?'active':''}" data-id="${esc(x.id)}"><h3>${esc(x.name)}</h3>${badges(x)}<div class="muted">知识稿 v${esc(x.version)} · 更新于 ${date(x.updated_at)}</div>${x.snip?`<div class="snippet">${esc(x.snip)}</div>`:''}</button>`).join(''):'<div class="empty">没有匹配内容，请缩短关键词或清除筛选。</div>';
 }catch(e){if(n===seq){$('summary').textContent='搜索失败：'+e.message;$('list').innerHTML='';}}
}
function reviewView(items){
 const actions={repair_verified:'补读核验通过',repair_version_verified:'补读版本核验通过',repair_reopened:'补读事项已重新打开',adopt:'采用指定口径',coexist:'保留并存',supersede:'新版替代旧版',unresolved:'暂不确定',reopen:'重新核实'};
 const classify=r=>r.question==='解析不完整；缺失部分不能视为已核实，需补材料或限定结论范围'?'parse':/版本更替|替代旧口径/.test(r.question)?'version':r.kind==='conflict'?'conflict':'verify';
 const groups=[
  ['parse','补齐解析','交给入库客户端补读缺失图片或页码，不是让你判断内容对错。'],
  ['conflict','不同口径待判断','对照双方依据，确认采用哪一方，或按适用范围并存。'],
  ['version','版本关系待判断','确认新版替代旧版，还是适用范围不同、需要并存。'],
  ['verify','使用前核实','原文依据或适用范围尚不充分；引用相关结论前核实，不必为了入库立即裁决。']
 ];
 const current=items.filter(r=>r.status==='pending'&&r.applies_to_current_version);
 const notices=items.filter(r=>r.status==='notice'&&r.applies_to_current_version);
 const oldPending=items.filter(r=>r.status==='pending'&&!r.applies_to_current_version);
 const history=items.filter(r=>!current.includes(r)&&!notices.includes(r)&&!oldPending.includes(r));
 const card=r=>{
  const k=classify(r),evidence=Array.isArray(r.evidence)?r.evidence:[];
  const statement=s=>String(s||'').replace(/missing_pages=\[([^\]]*)\]/g,'缺失页码或图片编号：$1（编号以入库记录为准）');
  const dec=r.decision;
  return '<article class="review-card"><div class="muted">知识稿 v'+esc(r.topic_version)+' · '+(r.applies_to_current_version?'当前版本':'历史版本')+' · '+(r.status==='pending'?'未解决':r.status==='notice'?'引用限制（未核实）':'已处理')+'</div><h3>'+esc(k==='parse'?'原件有部分内容尚未完成解析':r.question)+'</h3>'+
   (k==='parse'?'<p>下一步：让入库客户端重新读取下列缺失部分，补齐解析稿；补齐后仍需核对原确认项是否已处理。</p>':'')+
   '<div class="review-evidence"><b>已有依据</b>'+evidence.map((e,i)=>'<section><div class="muted">依据 '+(i+1)+'</div><p>'+esc(statement(e.statement))+'</p><div class="review-location">出处：'+esc(e.locator||'未记录')+'</div></section>').join('')+'</div>'+
   (dec?'<div class="notice"><b>已记录的处理意见：'+esc(actions[dec.action]||dec.action)+'</b>'+['conclusion','reason','scope','basis','confirmed_by','effective_at'].filter(key=>dec[key]).map(key=>'<p>'+esc({conclusion:'结论',reason:'原因',scope:'适用范围',basis:'依据',confirmed_by:'确认人',effective_at:'生效时间'}[key])+'：'+esc(dec[key])+'</p>').join('')+'</div>':'')+
   '<details class="review-technical"><summary>技术记录 / 交给入库客户端的编号</summary><p>'+esc(r.id)+'</p><pre>'+esc(JSON.stringify({evidence:r.evidence,decision:r.decision},null,2))+'</pre></details></article>';
 };
 return '<div class="notice">当前版本有 '+current.length+' 项未解决事项。下列分组仅帮助阅读，不改变确认状态；本页只读，不会自动裁决。</div>'+
  groups.map(([key,title,hint])=>{const rows=current.filter(r=>classify(r)===key);return rows.length?'<section class="review-group"><h3>'+title+' · '+rows.length+' 项</h3><p class="muted">'+hint+'</p>'+rows.map(card).join('')+'</section>':''}).join('')+
  (!current.length?'<p>当前版本没有已登记的待处理项，不代表全文已核实。</p>':'')+
  (notices.length?'<section class="review-group"><h3>引用时注意 · '+notices.length+' 项</h3><p class="muted">原文未披露的信息已保留限定，不需要立即人工裁决。</p>'+notices.map(card).join('')+'</section>':'')+
  (oldPending.length?'<details class="review-history"><summary>旧版本仍未解决 · '+oldPending.length+' 项（不会因新版出现自动解决）</summary>'+oldPending.map(card).join('')+'</details>':'')+
  (history.length?'<details class="review-history"><summary>历史版本及已处理事项 · '+history.length+' 项</summary>'+history.map(card).join('')+'</details>':'');
}
async function open(id){selected=id;const n=++detailSeq;document.querySelectorAll('.item').forEach(b=>b.classList.toggle('active',b.dataset.id===id));$('detail').innerHTML='<div class="empty">读取中…</div>';try{const d=await get('/api/library/detail?'+new URLSearchParams({doc_id:id}));if(n!==detailSeq)return;const u=url(d.receipts[0]?.source_url);$('detail').innerHTML=`<h2>${esc(d.name)}</h2>${badges(all.find(x=>x.id===id)||d)}<div class="muted">知识稿 v${esc(d.version)} · ${date(d.updated_at)} ${u?`· <a href="${esc(u)}" target="_blank" rel="noopener noreferrer">访问来源 ↗</a>`:''}</div><div class="notice">解析完整性由入库客户端声明，自动检查不是事实认证。待确认项请结合适用版本查看。</div><div class="tabs"><button data-tab="body">知识正文</button><button data-tab="source">来源与原件</button><button data-tab="review">确认事项</button><button data-tab="history">入库与版本</button></div><section id="content"></section>`;
const render=tab=>{document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));let html='';if(tab==='body'){html='<div class="prose">'+(d.body_available?markdown(d.body):(d.content_status==='needs_parse'?'仅保存了原件，尚未解析正文。可在“来源与原件”下载；需客户端解析后通过 prepared 补齐。':'暂无可读取的正文，不能据此判断材料为空。'))+'</div>';}if(tab==='source'){html='<h3>来源元数据</h3><pre>'+esc(JSON.stringify(d.source_metadata,null,2))+'</pre>'+d.receipts.map(r=>`<div class="block"><b>知识稿 v${esc(r.topic_version)}</b><div>${date(r.created_at)}</div>${(r.saved_layers?.raw||r.content_status==='needs_parse')?`<a href="/api/library/original?${new URLSearchParams({receipt_id:r.id})}">下载关联原件</a>`:'未记录原件层'}<div class="muted">原件可能为包含多份证据的ZIP。</div></div>`).join('');}if(tab==='review'){html=reviewView(d.review_items);}if(tab==='history'){html=d.receipts.map(r=>`<div class="block"><b>v${esc(r.topic_version)} · ${r.content_status==='needs_parse'?'仅存原件／待解析':r.status==='done'?'保存处理结束':esc(r.status)}</b><div>${date(r.created_at)}</div><div>原件 ${r.saved_layers?.raw?'已存':'未记录'} / 解析稿 ${r.saved_layers?.extract?'已存':'未记录'} / 知识稿 ${r.saved_layers?.wiki?'已存':'未记录'}</div><div>解析：${r.parse_complete===1?'客户端声明完整':r.parse_complete===0?'不完整':'未记录'}</div><small>${esc(r.id)}</small>${r.error?`<p>${esc(r.error)}</p>`:''}</div>`).join('')||'<div class="empty">暂无关联回执。</div>';} $('content').innerHTML=html;};render('body');document.querySelector('.tabs').onclick=e=>{if(e.target.dataset.tab)render(e.target.dataset.tab)};}catch(e){if(n===detailSeq)$('detail').textContent='读取失败：'+e.message;}}
$('list').onclick=e=>{const b=e.target.closest('[data-id]');if(b)open(b.dataset.id)};$('form').onsubmit=e=>{e.preventDefault();filter()};for(const id of ['scope','tag','state','age','dateFrom','dateTo','dateSort'])$(id).onchange=filter;$('refresh').onclick=load;load();
</script><style>
.review-group{margin:24px 0}.review-group>h3{font-size:18px}.review-card{border:1px solid var(--line);border-radius:8px;padding:18px;margin:12px 0;overflow-wrap:anywhere}.review-card h3{margin:12px 0;font-size:16px;line-height:1.8}.review-card p{margin:8px 0;white-space:pre-wrap}.review-evidence{background:#f6f7f4;padding:14px;border-radius:6px}.review-evidence section+section{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}.review-location{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.review-technical,.review-history{margin-top:16px;font-size:13px}summary{cursor:pointer;color:var(--accent)}.review-technical pre{margin-top:12px;font-size:12px}
</style></body></html>
